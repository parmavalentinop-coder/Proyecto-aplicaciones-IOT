<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Wi-Fi</title>
</head>

<body>

    <h1>Configuración Wi-Fi</h1>
    <p>Ingresá las credenciales de tu red para conectar el dispositivo.</p>

    <form action="/wifi" method="POST">

        <label for="ssid">Nombre de la red:</label>
        <input
            type="text"
            id="ssid"
            name="ssid"
            placeholder="Nombre de Wi-Fi"
            required
        >

        <br><br>

        <label for="password">Contraseña:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Contraseña de Wi-Fi"
        >

        <br><br>

        <button type="submit">Conectar</button>

    </form>

</body>
</html>
